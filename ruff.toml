line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.flake8-bugbear]
# FastAPI's idiomatic default-argument dependencies
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
